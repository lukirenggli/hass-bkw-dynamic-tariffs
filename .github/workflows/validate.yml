name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
jobs:
  hacs:
    name: Marketplace validation (HACS action)
    runs-on: ubuntu-24.04
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Use an available stable patch on a fixed runner image.
          python-version: "3.14"
          check-latest: true
      - name: Check Python compatibility
        run: python -c "import sys; assert sys.version_info >= (3, 14, 2), sys.version; print(sys.version)"
      - run: python -m pip install aiohttp==3.14.5
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py
  ha-smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Use an available stable patch on a fixed runner image.
          python-version: "3.14"
          check-latest: true
      - name: Check Python compatibility
        run: python -c "import sys; assert sys.version_info >= (3, 14, 2), sys.version; print(sys.version)"
      - run: python -m pip install 'homeassistant==2026.11.3'
      - run: python scripts/ha_smoke_test.py
